<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hudební Studio - Správa Lekcí</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        <aside class="sidebar">
            <div class="logo-section">
                <span class="logo-icon">🎵</span>
                <h2>Harmonie</h2>
                <p>Hudební studio</p>
            </div>
            
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active">📋 Přehled lekcí</a>
                <a href="#" class="nav-item">➕ Přidat lekci (v přípravě)</a>
                <a href="#" class="nav-item">👥 Studenti</a>
            </nav>
        </aside>

        <main class="main-content">
           <section class="form-section">
    <h3>Přidat novou lekci</h3>
    <form id="lekce-form">
        <input type="number" id="id" placeholder="ID lekce" required>
        <input type="text" id="nastroj" placeholder="Nástroj (např. Kytara)" required>
        <input type="number" id="cena" placeholder="Cena za hodinu" required>
        <input type="number" id="hodiny" placeholder="Počet hodin" required>
        <select id="typ">
            <option value="individualni">Individuální</option>
            <option value="workshop">Skupinový Workshop</option>
        </select>
        <input type="number" id="pocetZaku" placeholder="Počet žáků (jen pro workshop)" style="display:none;">
        <button type="submit">Přidat lekci</button>
    </form>
</section>
        </main>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
